name: Windows dev automation smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
      - name: Validate PowerShell syntax before executing
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'dev.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | Out-Host; throw "PowerShell parse failed" }
      - name: Setup toolchain and IntelliSense configuration
        shell: pwsh
        run: ./dev.cmd setup --ci
      - name: Add C++ file and vcpkg package
        shell: pwsh
        run: |
          ./dev.cmd add ci_smoke.cpp
          if (!(Test-Path src/ci_smoke.hpp)) { throw "Header was not generated" }
          ./dev.cmd install fmt
          @'
          #include "ci_smoke.hpp"
          #include <fmt/format.h>
          #include <string>
          namespace artun {
            void ci_smoke() { (void)fmt::format("value={}", 42); }
          }
          '@ | Set-Content -Path src/ci_smoke.cpp -Encoding ascii
      - name: Verify add-delete-add and automatic CMake regeneration
        shell: pwsh
        run: |
          ./dev.cmd run
          Remove-Item src/ci_smoke.cpp, src/ci_smoke.hpp
          ./dev.cmd sync
          ./dev.cmd run
          ./dev.cmd add again.cpp --no-header
          if (Test-Path src/again.hpp) { throw "Unexpected header in --no-header mode" }
          ./dev.cmd run
          Remove-Item src/again.cpp
          ./dev.cmd run
      - name: Install official MAVSDK C++ release
        shell: pwsh
        run: ./dev.cmd install mavsdk
      - name: Verify MAVSDK IntelliSense headers
        shell: pwsh
        run: |
          $settings = Get-Content .vscode/settings.json -Raw | ConvertFrom-Json
          $paths = @($settings.'C_Cpp.default.includePath')
          if ($paths -notcontains '${workspaceFolder}/.artun/sdk/mavsdk/include/**') { throw "MAVSDK IntelliSense include path missing" }
          if (-not (Test-Path .artun/sdk/mavsdk/include/mavsdk/mavsdk.hpp)) { throw "MAVSDK C++ v4 header missing" }
      - name: Install project-local ROS 2 via Pixi
        shell: pwsh
        run: ./dev.cmd install ros2
      - name: Verify ROS 2 and MAVSDK C++ headers and linkage
        shell: pwsh
        run: |
          @'
          #include <rclcpp/rclcpp.hpp>
          #include <std_msgs/msg/float32.hpp>
          #include <mavsdk/mavsdk.hpp>
          void artun_ci_compile_probe() {
              auto options = rclcpp::NodeOptions{};
              (void)options;
              auto config = mavsdk::Mavsdk::Configuration{mavsdk::ComponentType::GroundStation};
              (void)config;
              std_msgs::msg::Float32 message{};
              (void)message;
          }
          '@ | Set-Content -Path src/ci_integration.cpp -Encoding ascii
      - name: Build and run main.cpp
        shell: pwsh
        run: |
          $output = & ./dev.cmd run
          $output | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "dev run failed" }
          if (($output -join "`n") -notmatch "Hello World") { throw "Expected original main.cpp output missing" }
